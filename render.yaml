databases:
  - name: healthcopilot-db
    databaseName: healthcopilot
    user: healthcopilot
    plan: free
    region: singapore

services:
  - type: web
    name: healthcopilot-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: APP_ORIGIN
        fromService:
          type: web
          name: healthcopilot-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: healthcopilot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DOCUMENT_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MEDICAL_API_KEY
        sync: false
      - key: GEMINI_VOICE_API_KEY
        sync: false
      - key: GEMINI_MEDICAL_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: GEMINI_TTS_VOICE
        value: Kore
      - key: ENABLE_EXTERNAL_AI
        value: "true"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@healthcopilot.local
      - key: UPLOAD_MAX_MB
        value: "12"
